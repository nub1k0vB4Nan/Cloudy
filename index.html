<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudy</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      font-family: 'Plus Jakarta Sans', sans-serif;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #020617;
      color: #f8fafc;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    #bg-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-scaffold {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 56px 48px;
    }

    .custom-scrollbar-track {
      width: 100%;
      max-width: 900px;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      position: relative;
      margin-top: 14px;
      overflow: hidden;
      border: 1px solid rgba(56, 189, 248, 0.1);
    }

    .custom-scrollbar-thumb {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, #0284c7, #38bdf8);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      transition: left 0.08s ease-out, width 0.12s ease-out;
    }

    .game-tile-container {
      flex: 0 0 320px;
      aspect-ratio: 16 / 9;
      position: relative;
      cursor: pointer;
      border-radius: 20px;
      outline: none;
    }

    .switch-focus-border {
      position: absolute;
      inset: 0;
      border-radius: 20px;
      border: 5px solid transparent;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s cubic-bezier(0.2, 0.8, 0.25, 1);
      box-sizing: border-box;
      z-index: 2;
    }

    .game-tile {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 14px 30px -10px rgba(0, 0, 0, 0.85);
      background-size: cover;
      background-position: center;
      transition: transform 0.24s cubic-bezier(0.2, 0.8, 0.25, 1),
                  border-radius 0.24s cubic-bezier(0.2, 0.8, 0.25, 1);
      transform-origin: center center;
    }

    .game-tile-container:hover .game-tile,
    .game-tile-container:focus-visible .game-tile {
      transform: scale(0.965);
      border-radius: 16px;
    }

    .game-tile-container:hover .switch-focus-border,
    .game-tile-container:focus-visible .switch-focus-border {
      opacity: 1;
      animation: switchColorCycle 2s ease-in-out infinite alternate;
    }

    @keyframes switchColorCycle {
      0% {
        border-color: #2563eb;
        box-shadow: 0 0 20px rgba(37, 99, 235, 0.8), inset 0 0 10px rgba(37, 99, 235, 0.45);
      }
      50% {
        border-color: #0284c7;
        box-shadow: 0 0 24px rgba(2, 132, 199, 0.9), inset 0 0 12px rgba(2, 132, 199, 0.55);
      }
      100% {
        border-color: #38bdf8;
        box-shadow: 0 0 28px rgba(56, 189, 248, 1), inset 0 0 14px rgba(56, 189, 248, 0.7);
      }
    }

    .game-tile-container:active .game-tile {
      transform: scale(0.935);
      transition-duration: 0.08s;
    }

    .info-panel {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.25s cubic-bezier(0.25, 1, 0.5, 1),
                  transform 0.25s cubic-bezier(0.25, 1, 0.5, 1);
      pointer-events: none;
    }

    .info-panel.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .info-panel.switching {
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.12s ease-out, transform 0.12s ease-out;
    }

    .player-overlay {
      position: fixed;
      inset: 0;
      background: #000000;
      z-index: 100;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.97);
      transition: opacity 0.7s cubic-bezier(0.22, 1, 0.36, 1),
                  transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .player-overlay.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .loading-curtain {
      position: absolute;
      inset: 0;
      z-index: 105;
      background: radial-gradient(circle at center, #091a3e 0%, #020617 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
    }

    .loading-curtain.hidden-curtain {
      opacity: 0;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(56, 189, 248, 0.15);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .hud-trigger-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 260px;
      height: 150px;
      z-index: 120;
    }

    .hud-controls {
      position: absolute;
      top: 24px;
      right: 28px;
      z-index: 130;
      display: flex;
      align-items: center;
      gap: 12px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hud-trigger-zone:hover ~ .hud-controls,
    .hud-controls:hover {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .hud-btn {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #f1f5f9;
      border-radius: 9999px;
      padding: 9px 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
      transition: all 0.2s ease;
      outline: none;
    }

    .hud-btn:hover {
      background: rgba(30, 41, 59, 0.95);
      border-color: rgba(56, 189, 248, 0.75);
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.4);
      transform: translateY(-1px);
    }

    .hud-btn:active {
      transform: scale(0.96);
    }

    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body>

  <canvas id="bg-canvas"></canvas>

  <div class="app-scaffold">
    <header class="flex items-center justify-between">
      <div class="inline-flex items-center gap-3">
        <img
          src="logo.png"
          alt="Cloudy"
          class="h-9 w-auto object-contain"
          onload="this.style.display='block'; document.getElementById('fallback-logo').style.display='none';"
          onerror="this.style.display='none'; document.getElementById('fallback-logo').style.display='block';"
        >
        <span id="fallback-logo" style="display: none;" class="text-3xl font-extrabold tracking-tight text-white drop-shadow-[0_0_20px_rgba(56,189,248,0.4)]">
          Cloudy
        </span>
      </div>

      <div class="relative">
        <button id="theme-menu-btn" class="px-4 py-2 rounded-full bg-slate-900/60 hover:bg-slate-800/80 border border-sky-400/20 hover:border-sky-400/50 backdrop-blur-md text-xs font-semibold tracking-wide text-sky-200 transition-all flex items-center gap-2 outline-none shadow-lg">
          <svg class="w-4 h-4 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m18.37 2.63 3 3L13.5 13.5l-3-3L18.37 2.63z"></path>
            <path d="M12.5 12.5 9 16c-1.5 1.5-2.74 2-4.5 2-1 0-1.5-.5-1.5-1.5 0-1.76.5-3 2-4.5l3.5-3.5"></path>
            <path d="m2 22 3-3"></path>
          </svg>
          <span id="theme-btn-label">Deep Ocean Waves</span>
        </button>

        <div id="theme-dropdown" class="absolute right-0 mt-2 w-64 rounded-2xl bg-slate-900/90 border border-sky-400/25 backdrop-blur-xl shadow-2xl p-2 hidden flex-col gap-1 z-50">
          <button data-theme="random" class="theme-opt w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold text-sky-200 hover:bg-sky-500/20 hover:text-white transition-all flex items-center justify-between">
            <span>🎲 Random on Launch</span>
            <span class="check-mark text-sky-400"></span>
          </button>
          <button data-theme="ocean" class="theme-opt w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold text-sky-200 hover:bg-sky-500/20 hover:text-white transition-all flex items-center justify-between">
            <span>🌊 Deep Ocean Waves</span>
            <span class="check-mark text-sky-400"></span>
          </button>
          <button data-theme="nebula" class="theme-opt w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold text-sky-200 hover:bg-sky-500/20 hover:text-white transition-all flex items-center justify-between">
            <span>✨ Starfield & Nebula</span>
            <span class="check-mark text-sky-400"></span>
          </button>
          <button data-theme="aurora" class="theme-opt w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold text-sky-200 hover:bg-sky-500/20 hover:text-white transition-all flex items-center justify-between">
            <span>🌌 Aurora Flow</span>
            <span class="check-mark text-sky-400"></span>
          </button>
          <button data-theme="matrix" class="theme-opt w-full text-left px-3.5 py-2.5 rounded-xl text-xs font-semibold text-sky-200 hover:bg-sky-500/20 hover:text-white transition-all flex items-center justify-between">
            <span>⚡ Cyber 3D Grid</span>
            <span class="check-mark text-sky-400"></span>
          </button>
        </div>
      </div>
    </header>

    <main class="w-full max-w-7xl mx-auto flex flex-col justify-center my-auto">
      <div id="empty-state" class="w-full flex flex-col items-center justify-center text-center py-16 hidden">
        <div class="w-16 h-16 rounded-2xl bg-sky-500/10 border border-sky-400/20 flex items-center justify-center mb-6 shadow-[0_0_25px_rgba(56,189,248,0.15)]">
          <svg class="w-8 h-8 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z" />
          </svg>
        </div>
        <h2 class="text-2xl md:text-3xl font-bold text-white tracking-tight">No Games Available</h2>
        <p class="text-sm md:text-base text-sky-200/60 mt-3 max-w-md leading-relaxed">
          Check your network connection or verify service status. Games will populate once configured.
        </p>
        <button id="retry-btn" class="mt-6 px-6 py-2.5 rounded-full bg-sky-500/15 hover:bg-sky-500/25 active:scale-95 border border-sky-400/30 text-sky-300 hover:text-sky-100 text-sm font-semibold tracking-wide transition-all inline-flex items-center gap-2 outline-none">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M2.5 22v-6h6M2 11.5a10 10 0 0 1 18.8-4.3M22 12.5a10 10 0 0 1-18.8 4.2"/>
          </svg>
          Retry Connection
        </button>
      </div>

      <div id="games-section" class="w-full flex flex-col">
        <div id="tiles-row" class="flex items-center gap-7 py-6 px-3 overflow-x-auto hide-scrollbar scroll-smooth"></div>

        <div class="custom-scrollbar-track" id="scrollbar-track">
          <div class="custom-scrollbar-thumb" id="scrollbar-thumb"></div>
        </div>

        <div id="info-panel" class="info-panel mt-7 min-h-[96px] max-w-2xl">
          <h1 id="game-title" class="text-3xl md:text-4xl font-extrabold tracking-tight text-white drop-shadow-md"></h1>
          <p id="game-desc" class="text-sm md:text-base text-sky-200/75 mt-2 leading-relaxed font-normal"></p>
        </div>
      </div>
    </main>

    <footer class="h-6"></footer>
  </div>

  <div id="player-overlay" class="player-overlay">
    <div id="hud-trigger-zone" class="hud-trigger-zone"></div>
    <div id="hud-controls" class="hud-controls">
      <button id="hud-fullscreen-btn" class="hud-btn" title="Toggle Fullscreen">
        <svg class="w-4 h-4 text-sky-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
        </svg>
        <span>Toggle Fullscreen</span>
      </button>
      <button id="hud-close-btn" class="hud-btn" title="Exit to cloudy dashboard">
        <svg class="w-4 h-4 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
        <span>Exit Game</span>
      </button>
    </div>

    <div id="loading-curtain" class="loading-curtain">
      <div class="spinner mb-4"></div>
      <span id="loading-title" class="text-base font-semibold tracking-wide text-sky-200/80">Launching...</span>
    </div>

    <div id="player-container" class="w-full h-full flex items-center justify-center relative bg-black"></div>
  </div>

  <script>
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let animId = null;
    let currentTheme = 'ocean';
    let isRandomTheme = false;
    let simTime = 0;

    const themeTitles = {
      ocean: 'Deep Ocean Waves',
      nebula: 'Starfield & Nebula',
      aurora: 'Aurora Flow',
      matrix: 'Cyber 3D Grid'
    };

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const stars = Array.from({ length: 260 }, () => ({
      x: (Math.random() - 0.5) * 2000,
      y: (Math.random() - 0.5) * 2000,
      z: Math.random() * 1500 + 100,
      size: Math.random() * 2 + 1
    }));

    function drawOcean() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, width, height);

      const layers = [
        { speed: 0.0006, amp: 85, freq: 0.0018, color: 'rgba(30, 64, 175, 0.4)', yOffset: 0.62 },
        { speed: 0.0010, amp: 110, freq: 0.0012, color: 'rgba(2, 132, 199, 0.3)', yOffset: 0.70 },
        { speed: 0.0005, amp: 145, freq: 0.0009, color: 'rgba(56, 189, 248, 0.22)', yOffset: 0.78 }
      ];

      layers.forEach(layer => {
        ctx.beginPath();
        ctx.moveTo(0, height);
        for (let x = 0; x <= width; x += 12) {
          const y = height * layer.yOffset +
            Math.sin(x * layer.freq + simTime * layer.speed) * layer.amp +
            Math.sin(x * layer.freq * 0.45 + simTime * layer.speed * 0.75) * (layer.amp * 0.4);
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fillStyle = layer.color;
        ctx.fill();
      });
    }

    function drawNebula() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      const grad = ctx.createRadialGradient(
        width * 0.55 + Math.cos(simTime * 0.00025) * 80,
        height * 0.48 + Math.sin(simTime * 0.0002) * 60,
        40,
        width * 0.5,
        height * 0.5,
        width * 0.75
      );
      grad.addColorStop(0, 'rgba(56, 189, 248, 0.22)');
      grad.addColorStop(0.45, 'rgba(37, 99, 235, 0.12)');
      grad.addColorStop(1, 'rgba(2, 6, 23, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      for (let s of stars) {
        s.z -= 0.35;
        if (s.z <= 10) {
          s.z = 1500;
          s.x = (Math.random() - 0.5) * 2000;
          s.y = (Math.random() - 0.5) * 2000;
        }

        const k = 450 / s.z;
        const px = s.x * k + cx;
        const py = s.y * k + cy;

        if (px >= 0 && px <= width && py >= 0 && py <= height) {
          const sz = Math.max(0.6, (1 - s.z / 1500) * 2.4);
          const alpha = Math.min(0.9, Math.max(0.1, 1 - s.z / 1500));
          ctx.fillStyle = `rgba(186, 230, 253, ${alpha})`;
          ctx.beginPath();
          ctx.arc(px, py, sz, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    function drawAurora() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      const curtainCount = 18;
      const step = width / curtainCount;

      for (let i = 0; i < curtainCount; i++) {
        const x = i * step + Math.sin(simTime * 0.0008 + i * 0.4) * 35;
        const beamW = step * 1.8;
        const sway = Math.sin(simTime * 0.001 + i * 0.35) * 80;
        const reach = height * (0.65 + Math.sin(simTime * 0.0012 + i * 0.5) * 0.2);

        const beamGrad = ctx.createLinearGradient(x + sway, 0, x - sway, reach);
        const huePhase = (i % 3);
        if (huePhase === 0) {
          beamGrad.addColorStop(0, 'rgba(6, 182, 212, 0)');
          beamGrad.addColorStop(0.2, 'rgba(6, 182, 212, 0.22)');
          beamGrad.addColorStop(0.6, 'rgba(56, 189, 248, 0.16)');
          beamGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');
        } else if (huePhase === 1) {
          beamGrad.addColorStop(0, 'rgba(37, 99, 235, 0)');
          beamGrad.addColorStop(0.25, 'rgba(37, 99, 235, 0.26)');
          beamGrad.addColorStop(0.7, 'rgba(129, 140, 248, 0.14)');
          beamGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');
        } else {
          beamGrad.addColorStop(0, 'rgba(14, 165, 233, 0)');
          beamGrad.addColorStop(0.3, 'rgba(14, 165, 233, 0.2)');
          beamGrad.addColorStop(0.75, 'rgba(2, 132, 199, 0.1)');
          beamGrad.addColorStop(1, 'rgba(2, 6, 23, 0)');
        }

        ctx.fillStyle = beamGrad;
        ctx.fillRect(x - beamW * 0.5, 0, beamW, reach);
      }
    }

    function drawMatrix() {
      ctx.fillStyle = '#020713';
      ctx.fillRect(0, 0, width, height);

      const horizon = height * 0.44;
      const groundH = height - horizon;
      const speed = (simTime * 0.006) % 1;

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.25)';
      ctx.lineWidth = 1;

      const totalH = 14;
      for (let i = 0; i <= totalH; i++) {
        const p = (i + speed) / totalH;
        const normY = Math.pow(p, 2.6);
        const lineY = horizon + normY * groundH;

        if (lineY >= horizon && lineY <= height) {
          ctx.beginPath();
          ctx.moveTo(0, lineY);
          ctx.lineTo(width, lineY);
          ctx.stroke();
        }
      }

      const totalV = 24;
      for (let i = -totalV; i <= totalV * 2; i++) {
        const bottomX = (i / totalV) * width;
        const topX = width * 0.5 + (bottomX - width * 0.5) * 0.06;

        ctx.beginPath();
        ctx.moveTo(topX, horizon);
        ctx.lineTo(bottomX, height);
        ctx.stroke();
      }

      const glow = ctx.createLinearGradient(0, horizon - 90, 0, horizon + 50);
      glow.addColorStop(0, 'rgba(56, 189, 248, 0)');
      glow.addColorStop(0.55, 'rgba(56, 189, 248, 0.35)');
      glow.addColorStop(1, 'rgba(56, 189, 248, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(0, horizon - 90, width, 140);
    }

    function animate() {
      simTime += 1;
      if (currentTheme === 'ocean') drawOcean();
      else if (currentTheme === 'nebula') drawNebula();
      else if (currentTheme === 'aurora') drawAurora();
      else if (currentTheme === 'matrix') drawMatrix();
      animId = requestAnimationFrame(animate);
    }
    requestAnimationFrame(animate);

    const themeMenuBtn = document.getElementById('theme-menu-btn');
    const themeDropdown = document.getElementById('theme-dropdown');
    const themeBtnLabel = document.getElementById('theme-btn-label');
    const themeOptions = document.querySelectorAll('.theme-opt');

    function setTheme(themeKey, isRandom = false) {
      isRandomTheme = isRandom;
      if (isRandom) {
        const keys = ['ocean', 'nebula', 'aurora', 'matrix'];
        currentTheme = keys[Math.floor(Math.random() * keys.length)];
        themeBtnLabel.textContent = `Random (${themeTitles[currentTheme]})`;
      } else {
        currentTheme = themeKey;
        themeBtnLabel.textContent = themeTitles[themeKey];
      }

      themeOptions.forEach(opt => {
        const mark = opt.querySelector('.check-mark');
        const optTheme = opt.getAttribute('data-theme');
        if (isRandom && optTheme === 'random') {
          mark.textContent = '✓';
        } else if (!isRandom && optTheme === currentTheme) {
          mark.textContent = '✓';
        } else {
          mark.textContent = '';
        }
      });
    }

    themeMenuBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themeDropdown.classList.toggle('hidden');
      themeDropdown.classList.toggle('flex');
    });

    document.addEventListener('click', () => {
      themeDropdown.classList.add('hidden');
      themeDropdown.classList.remove('flex');
    });

    themeOptions.forEach(opt => {
      opt.addEventListener('click', (e) => {
        e.stopPropagation();
        const sel = opt.getAttribute('data-theme');
        if (sel === 'random') {
          setTheme('ocean', true);
        } else {
          setTheme(sel, false);
        }
        themeDropdown.classList.add('hidden');
        themeDropdown.classList.remove('flex');
      });
    });

    const initialThemes = ['ocean', 'nebula', 'aurora', 'matrix'];
    setTheme(initialThemes[Math.floor(Math.random() * initialThemes.length)], false);

    const emptyState = document.getElementById('empty-state');
    const gamesSection = document.getElementById('games-section');
    const tilesRow = document.getElementById('tiles-row');
    const scrollbarThumb = document.getElementById('scrollbar-thumb');
    const infoPanel = document.getElementById('info-panel');
    const titleEl = document.getElementById('game-title');
    const descEl = document.getElementById('game-desc');
    const retryBtn = document.getElementById('retry-btn');

    const playerOverlay = document.getElementById('player-overlay');
    const playerContainer = document.getElementById('player-container');
    const loadingCurtain = document.getElementById('loading-curtain');
    const loadingTitle = document.getElementById('loading-title');
    const hudCloseBtn = document.getElementById('hud-close-btn');
    const hudFullscreenBtn = document.getElementById('hud-fullscreen-btn');

    let games = [];
    let switchTimeout = null;
    let hideTimeout = null;
    let isPanelVisible = false;

    async function loadCatalog() {
      try {
        const response = await fetch(`games.json?t=${Date.now()}`);
        if (response.ok) {
          const data = await response.json();
          if (Array.isArray(data) && data.length > 0) {
            games = data;
            renderGames();
            return;
          }
        }
      } catch (err) {}

      games = [];
      renderGames();
    }

    function updateScrollbar() {
      const maxScroll = tilesRow.scrollWidth - tilesRow.clientWidth;
      if (maxScroll <= 0) {
        scrollbarThumb.style.width = '100%';
        scrollbarThumb.style.left = '0%';
        return;
      }
      const viewRatio = tilesRow.clientWidth / tilesRow.scrollWidth;
      const thumbWidthPercent = Math.max(viewRatio * 100, 10);
      const scrollProgress = tilesRow.scrollLeft / maxScroll;
      const maxLeftPercent = 100 - thumbWidthPercent;

      scrollbarThumb.style.width = `${thumbWidthPercent}%`;
      scrollbarThumb.style.left = `${scrollProgress * maxLeftPercent}%`;
    }
    tilesRow.addEventListener('scroll', updateScrollbar);

    tilesRow.addEventListener('wheel', (e) => {
      e.preventDefault();
      tilesRow.scrollLeft += e.deltaY * 1.5;
    }, { passive: false });

    function renderGames() {
      if (!games || games.length === 0) {
        emptyState.classList.remove('hidden');
        gamesSection.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      gamesSection.classList.remove('hidden');
      tilesRow.innerHTML = '';

      games.forEach((game, index) => {
        const container = document.createElement('div');
        container.className = 'game-tile-container';
        container.tabIndex = 0;
        container.setAttribute('data-title', game.title || 'Untitled');
        container.setAttribute('data-desc', game.desc || game.description || '');

        const focusBorder = document.createElement('div');
        focusBorder.className = 'switch-focus-border';

        const tile = document.createElement('div');
        tile.className = 'game-tile';

        const cardGradients = [
          'radial-gradient(circle at 30% 30%, #38bdf8 0%, #1e40af 60%, #030712 100%)',
          'radial-gradient(circle at 30% 30%, #818cf8 0%, #3730a3 60%, #030712 100%)',
          'radial-gradient(circle at 30% 30%, #06b6d4 0%, #0e7490 60%, #030712 100%)'
        ];
        tile.style.background = cardGradients[index % cardGradients.length];

        if (game.cover) {
          const img = new Image();
          img.src = game.cover.startsWith('http') ? game.cover : `./${game.cover}`;
          img.onload = () => {
            tile.style.backgroundImage = `url("${img.src}")`;
          };
        }

        const tileLabel = document.createElement('div');
        tileLabel.className = 'absolute bottom-4 left-4 right-4 pointer-events-none drop-shadow-md';
        tileLabel.innerHTML = `
          <div class="text-xs font-bold uppercase tracking-wider text-sky-300">INSTANT PLAY</div>
          <div class="text-lg font-extrabold text-white truncate">${game.title}</div>
        `;
        tile.appendChild(tileLabel);

        container.appendChild(focusBorder);
        container.appendChild(tile);
        tilesRow.appendChild(container);

        function handleFocus() {
          clearTimeout(hideTimeout);
          clearTimeout(switchTimeout);

          const newTitle = container.getAttribute('data-title');
          const newDesc = container.getAttribute('data-desc');

          if (!isPanelVisible) {
            titleEl.textContent = newTitle;
            descEl.textContent = newDesc;
            infoPanel.classList.remove('switching');
            infoPanel.classList.add('visible');
            isPanelVisible = true;
          } else if (titleEl.textContent !== newTitle) {
            infoPanel.classList.add('switching');
            switchTimeout = setTimeout(() => {
              titleEl.textContent = newTitle;
              descEl.textContent = newDesc;
              infoPanel.classList.remove('switching');
            }, 120);
          }
        }

        function handleBlur() {
          clearTimeout(switchTimeout);
          hideTimeout = setTimeout(() => {
            infoPanel.classList.remove('visible', 'switching');
            isPanelVisible = false;
          }, 100);
        }

        container.addEventListener('mouseenter', handleFocus);
        container.addEventListener('focus', handleFocus);
        container.addEventListener('mouseleave', handleBlur);
        container.addEventListener('blur', handleBlur);

        container.addEventListener('click', () => {
          launchGame(game);
        });
      });

      updateScrollbar();
    }

    function createBuiltinArcade(title) {
      const container = document.createElement('div');
      container.className = 'w-full h-full flex flex-col items-center justify-center relative bg-slate-950';

      const gameCanvas = document.createElement('canvas');
      gameCanvas.className = 'w-full h-full block';
      container.appendChild(gameCanvas);

      const banner = document.createElement('div');
      banner.className = 'absolute top-8 left-8 pointer-events-none';
      banner.innerHTML = `
        <div class="text-xs uppercase tracking-widest text-sky-400 font-bold">Cloudy Runtime</div>
        <div class="text-2xl font-black text-white">${title}</div>
        <div class="text-xs text-sky-200/60 mt-1">Move cursor to steer & dodge hazards</div>
      `;
      container.appendChild(banner);

      setTimeout(() => {
        const gctx = gameCanvas.getContext('2d');
        let gW = gameCanvas.width = container.clientWidth || window.innerWidth;
        let gH = gameCanvas.height = container.clientHeight || window.innerHeight;

        let playerX = gW / 2;
        let playerY = gH * 0.8;
        let obstacles = [];
        let score = 0;
        let running = true;

        const onMove = (e) => {
          const rect = gameCanvas.getBoundingClientRect();
          playerX = e.clientX - rect.left;
        };
        window.addEventListener('mousemove', onMove);

        function gameLoop() {
          if (!running) return;
          gctx.fillStyle = 'rgba(2, 6, 23, 0.3)';
          gctx.fillRect(0, 0, gW, gH);

          score += 1;

          if (Math.random() < 0.08) {
            obstacles.push({
              x: Math.random() * gW,
              y: -20,
              size: Math.random() * 24 + 14,
              speed: Math.random() * 4 + 4
            });
          }

          for (let i = obstacles.length - 1; i >= 0; i--) {
            const obs = obstacles[i];
            obs.y += obs.speed;

            gctx.fillStyle = '#38bdf8';
            gctx.shadowColor = '#0284c7';
            gctx.shadowBlur = 15;
            gctx.beginPath();
            gctx.arc(obs.x, obs.y, obs.size, 0, Math.PI * 2);
            gctx.fill();
            gctx.shadowBlur = 0;

            if (obs.y > gH + 50) obstacles.splice(i, 1);
          }

          gctx.fillStyle = '#ffffff';
          gctx.shadowColor = '#38bdf8';
          gctx.shadowBlur = 20;
          gctx.beginPath();
          gctx.moveTo(playerX, playerY - 18);
          gctx.lineTo(playerX - 16, playerY + 16);
          gctx.lineTo(playerX + 16, playerY + 16);
          gctx.closePath();
          gctx.fill();
          gctx.shadowBlur = 0;

          gctx.fillStyle = '#f8fafc';
          gctx.font = 'bold 16px Plus Jakarta Sans, sans-serif';
          gctx.fillText(`SCORE: ${score}`, gW - 140, 48);

          container._animId = requestAnimationFrame(gameLoop);
        }
        gameLoop();

        container._cleanup = () => {
          running = false;
          cancelAnimationFrame(container._animId);
          window.removeEventListener('mousemove', onMove);
        };
      }, 50);

      return container;
    }

    let activeBuiltin = null;

    function launchGame(game) {
      playerContainer.innerHTML = '';
      loadingTitle.textContent = game.title || 'Launching...';
      loadingCurtain.classList.remove('hidden-curtain');
      playerOverlay.classList.add('active');

      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else if (document.documentElement.webkitRequestFullscreen) {
        document.documentElement.webkitRequestFullscreen();
      }

      if (game.path) {
        const iframe = document.createElement('iframe');
        iframe.className = 'w-full h-full border-0';
        iframe.src = game.path.startsWith('http') ? game.path : `./${game.path}`;
        iframe.allow = 'autoplay; fullscreen; gamepad; focus-without-user-activation *';
        iframe.setAttribute('allowfullscreen', 'true');

        iframe.onload = () => {
          setTimeout(() => {
            loadingCurtain.classList.add('hidden-curtain');
          }, 800);
        };

        iframe.onerror = () => {
          playerContainer.innerHTML = `
            <div class="text-center p-8">
              <div class="text-xl font-bold text-rose-400">Failed to load build</div>
              <div class="text-sm text-slate-400 mt-2">Resource path not found: ${game.path}</div>
            </div>
          `;
          loadingCurtain.classList.add('hidden-curtain');
        };

        playerContainer.appendChild(iframe);
      } else {
        setTimeout(() => {
          loadingCurtain.classList.add('hidden-curtain');
        }, 800);
      }
    }

    function closeGame() {
      playerOverlay.classList.remove('active');

      setTimeout(() => {
        playerContainer.innerHTML = '';
        loadingCurtain.classList.remove('hidden-curtain');
      }, 700);

      if (document.fullscreenElement || document.webkitFullscreenElement) {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    }

    hudCloseBtn.addEventListener('click', closeGame);

    hudFullscreenBtn.addEventListener('click', () => {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        }
      }
    });

    retryBtn.addEventListener('click', () => {
      loadCatalog();
    });

    loadCatalog();
  </script>
</body>
</html>
