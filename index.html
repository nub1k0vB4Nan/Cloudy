<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #020617;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 36px 56px 44px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      height: 64px;
      max-width: 320px;
      object-fit: contain;
      display: block;
    }

    .brand-fallback {
      font-size: 48px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.45);
    }

    .theme-picker-container {
      position: relative;
    }

    .theme-picker-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(14px);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: all 0.25s ease;
    }

    .theme-picker-btn:hover {
      background: rgba(37, 99, 235, 0.7);
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.5);
      transform: scale(1.08);
    }

    .theme-picker-btn svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .theme-dropdown {
      position: absolute;
      top: 58px;
      right: 0;
      width: 260px;
      background: rgba(10, 16, 30, 0.94);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(24px);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.65);
      display: flex;
      flex-direction: column;
      gap: 6px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 50;
    }

    .theme-dropdown.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .dropdown-section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: rgba(56, 189, 248, 0.85);
      padding: 4px 8px 2px;
    }

    .theme-option {
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.8);
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .theme-option:hover {
      background: rgba(37, 99, 235, 0.25);
      color: #38bdf8;
    }

    .theme-option.active {
      background: rgba(37, 99, 235, 0.4);
      color: #ffffff;
      font-weight: 600;
    }

    .dropdown-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
      margin: 6px 4px;
    }

    .speed-slider-box {
      padding: 6px 8px 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .speed-slider-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.7);
    }

    .speed-value-badge {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 7px;
      border-radius: 6px;
    }

    .speed-range-input {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 5px;
      background: rgba(255, 255, 255, 0.15);
      outline: none;
      cursor: pointer;
    }

    .speed-range-input::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.9);
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    .speed-range-input::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .main-content {
      width: 100%;
      display: flex;
      flex-direction: column;
      margin-top: 18px;
      margin-bottom: auto;
    }

    .shelf-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    .shelf-scroll-area {
      display: flex;
      gap: 28px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 16px 4px 20px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .shelf-scroll-area::-webkit-scrollbar {
      display: none;
    }

    .game-tile {
      position: relative;
      flex: 0 0 340px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      background: #090e1a;
      cursor: pointer;
      outline: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-tile-inner {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at center, #1e293b, #090d16);
      transform-origin: center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }

    .game-tile-border {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      border: 5px solid #2563eb;
      box-shadow: inset 0 0 16px rgba(56, 189, 248, 0.5), 0 0 24px rgba(37, 99, 235, 0.6);
      transition: opacity 0.3s ease;
    }

    .game-tile:hover .game-tile-inner,
    .game-tile:focus-visible .game-tile-inner {
      transform: scale(0.97);
    }

    .game-tile:hover .game-tile-border,
    .game-tile:focus-visible .game-tile-border {
      opacity: 1;
      animation: switchBorderShift 2.4s ease-in-out infinite alternate;
    }

    .game-tile:active .game-tile-inner {
      transform: scale(0.94);
    }

    @keyframes switchBorderShift {
      0% {
        border-color: #2563eb;
        box-shadow: inset 0 0 16px rgba(37, 99, 235, 0.6), 0 0 20px rgba(37, 99, 235, 0.5);
      }
      50% {
        border-color: #0284c7;
        box-shadow: inset 0 0 22px rgba(2, 132, 199, 0.8), 0 0 32px rgba(2, 132, 199, 0.7);
      }
      100% {
        border-color: #38bdf8;
        box-shadow: inset 0 0 18px rgba(56, 189, 248, 0.9), 0 0 28px rgba(56, 189, 248, 0.8);
      }
    }

    .custom-scrollbar-track {
      width: calc(100% - 48px);
      margin: 0 auto;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .custom-scrollbar-thumb {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      transition: left 0.1s ease-out, width 0.1s ease-out;
    }

    .details-pane {
      min-height: 96px;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      pointer-events: none;
      max-width: 100%;
      margin-top: 24px;
    }

    .details-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .details-description {
      margin-top: 6px;
      font-size: 16px;
      line-height: 1.4;
      color: rgba(255, 255, 255, 0.7);
      max-width: 80vw;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: 0.04s;
    }

    .details-title.active,
    .details-description.active {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-shelf {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding: 64px 0;
    }

    .empty-shelf-title {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .empty-shelf-subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.5);
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .retry-button {
      padding: 12px 32px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(14, 165, 233, 0.12);
      color: #38bdf8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .retry-button:hover {
      background: rgba(14, 165, 233, 0.28);
      border-color: #38bdf8;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
      transform: scale(1.04);
    }

    .game-runtime-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000000;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-runtime-overlay.running {
      opacity: 1;
      pointer-events: all;
      transform: scale(1);
    }

    .game-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    .hud-hover-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 240px;
      height: 140px;
      z-index: 120;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 24px;
    }

    .hud-controls-dock {
      display: flex;
      gap: 12px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .hud-hover-zone:hover .hud-controls-dock {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .hud-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .hud-btn:hover {
      background: rgba(37, 99, 235, 0.8);
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      transform: scale(1.08);
    }

    .hud-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <canvas id="ambient-canvas" class="ambient-canvas"></canvas>

  <div class="app-viewport">
    <div class="top-bar">
      <header class="brand-header">
        <img src="logo.png" alt="Cloudy" class="brand-logo" id="main-logo">
        <div class="brand-fallback" id="brand-fallback-text" style="display: none;">Cloudy</div>
      </header>

      <div class="theme-picker-container">
        <button class="theme-picker-btn" id="theme-btn" title="Visual Theme">
          <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61e-4.38.48-.63 1.12-.63 1.77 0 1.44 1.16 2.61 2.6 2.61.47 0 .91-.13 1.28-.35.43-.26.96-.42 1.53-.42h1.25c4.97 0 9-4.03 9-9s-4.03-9-9-9zm-5.5 9c-.83 0-1.5-.67-1.5-1.5S5.67 9 6.5 9 8 9.67 8 10.5 7.33 12 6.5 12zm3-4C8.67 8 8 7.33 8 6.5S8.67 5 9.5 5s1.5.67 1.5 1.5S10.33 8 9.5 8zm5 0c-.83 0-1.5-.67-1.5-1.5S13.67 5 14.5 5s1.5.67 1.5 1.5S15.33 8 14.5 8zm3 4c-.83 0-1.5-.67-1.5-1.5S16.67 9 17.5 9s1.5.67 1.5 1.5-.67 1.5-1.5 1.5z"/></svg>
        </button>
        <div class="theme-dropdown" id="theme-dropdown">
          <div class="dropdown-section-label">Background Style</div>
          <div class="theme-option" data-theme="waves">Waves</div>
          <div class="theme-option" data-theme="nebula">Starfield & Nebula</div>
          <div class="theme-option" data-theme="aurora">Aurora Flow</div>
          <div class="theme-option" data-theme="grid">Cyber 3D Grid</div>
          <div class="dropdown-divider"></div>
          <div class="speed-slider-box">
            <div class="speed-slider-header">
              <span>Motion Speed</span>
              <span class="speed-value-badge" id="speed-badge">1.0x</span>
            </div>
            <input type="range" min="0.2" max="2.5" step="0.1" value="1.0" class="speed-range-input" id="speed-slider">
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="shelf-container" id="shelf-container">
        <div class="shelf-scroll-area" id="shelf-scroll-area"></div>
        <div class="custom-scrollbar-track" id="scrollbar-track">
          <div class="custom-scrollbar-thumb" id="scrollbar-thumb"></div>
        </div>
      </div>

      <div class="details-pane">
        <div class="details-title" id="details-title"></div>
        <div class="details-description" id="details-description"></div>
      </div>
    </div>

    <div></div>
  </div>

  <div class="game-runtime-overlay" id="game-overlay">
    <div class="hud-hover-zone">
      <div class="hud-controls-dock">
        <button class="hud-btn" id="btn-toggle-fullscreen" title="Toggle Fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <button class="hud-btn" id="btn-exit-game" title="Exit to Hub">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <iframe class="game-frame" id="game-frame" allow="autoplay; fullscreen; gamepad"></iframe>
  </div>

  <script>
    const canvas = document.getElementById('ambient-canvas');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let time = 0;

    const themes = ['waves', 'nebula', 'aurora', 'grid'];
    let currentTheme = localStorage.getItem('cloudy_theme') || themes[Math.floor(Math.random() * themes.length)];
    let animSpeedMultiplier = parseFloat(localStorage.getItem('cloudy_anim_speed')) || 1.0;

    function resize() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    const stars = Array.from({ length: 110 }, () => ({
      x: (Math.random() - 0.5) * 2000,
      y: (Math.random() - 0.5) * 2000,
      z: Math.random() * 1000 + 200
    }));

    function renderWaves() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, width, height);

      const layers = [
        { speed: 0.0006, amp: 80, freq: 0.0016, color: 'rgba(37, 99, 235, 0.25)', y: 0.65 },
        { speed: 0.0009, amp: 110, freq: 0.0011, color: 'rgba(2, 132, 199, 0.20)', y: 0.72 },
        { speed: 0.0004, amp: 140, freq: 0.0008, color: 'rgba(56, 189, 248, 0.15)', y: 0.78 }
      ];

      layers.forEach(l => {
        ctx.beginPath();
        ctx.moveTo(0, height);
        for (let x = 0; x <= width; x += 16) {
          const y = height * l.y + Math.sin(x * l.freq + time * l.speed) * l.amp;
          ctx.lineTo(x, y);
        }
        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fillStyle = l.color;
        ctx.fill();
      });
    }

    function renderNebula() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      const grad1 = ctx.createRadialGradient(width * 0.3, height * 0.4, 40, width * 0.3, height * 0.4, width * 0.65);
      grad1.addColorStop(0, 'rgba(37, 99, 235, 0.22)');
      grad1.addColorStop(1, 'transparent');
      ctx.fillStyle = grad1;
      ctx.fillRect(0, 0, width, height);

      const grad2 = ctx.createRadialGradient(width * 0.75, height * 0.7, 50, width * 0.75, height * 0.7, width * 0.55);
      grad2.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
      grad2.addColorStop(1, 'transparent');
      ctx.fillStyle = grad2;
      ctx.fillRect(0, 0, width, height);

      const cx = width / 2;
      const cy = height / 2;

      stars.forEach(s => {
        s.z -= 0.35 * animSpeedMultiplier;
        if (s.z <= 1) s.z = 1000;
        const k = 400 / s.z;
        const px = cx + s.x * k;
        const py = cy + s.y * k;
        if (px >= 0 && px <= width && py >= 0 && py <= height) {
          const alpha = Math.min((1 - s.z / 1000) * 0.85, 0.9);
          ctx.fillStyle = `rgba(255, 255, 255, ${alpha})`;
          ctx.fillRect(px, py, Math.max(k * 1.5, 1.2), Math.max(k * 1.5, 1.2));
        }
      });
    }

    function renderAurora() {
      ctx.fillStyle = '#02050f';
      ctx.fillRect(0, 0, width, height);

      const ribbons = [
        { speed: 0.0009, color1: 'rgba(56, 189, 248, 0.22)', color2: 'rgba(37, 99, 235, 0.05)', offset: 0 },
        { speed: 0.0006, color1: 'rgba(2, 132, 199, 0.18)', color2: 'rgba(14, 165, 233, 0.02)', offset: 2.2 }
      ];

      ribbons.forEach(r => {
        const rayCount = 18;
        const colWidth = width / rayCount;

        for (let i = 0; i <= rayCount; i++) {
          const x = i * colWidth;
          const sway = Math.sin(i * 0.4 + time * r.speed + r.offset) * 45;
          const beamH = height * (0.55 + Math.cos(i * 0.3 + time * r.speed * 0.8) * 0.2);

          const grad = ctx.createLinearGradient(x + sway, 0, x - sway, beamH);
          grad.addColorStop(0, r.color1);
          grad.addColorStop(0.7, r.color2);
          grad.addColorStop(1, 'transparent');

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(x - colWidth * 0.6, 0);
          ctx.lineTo(x + colWidth * 0.6, 0);
          ctx.lineTo(x + sway + colWidth * 1.2, beamH);
          ctx.lineTo(x + sway - colWidth * 1.2, beamH);
          ctx.closePath();
          ctx.fill();
        }
      });
    }

    function renderGrid() {
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, width, height);

      const horizon = height * 0.52;
      const groundH = height - horizon;

      const grad = ctx.createLinearGradient(0, horizon, 0, height);
      grad.addColorStop(0, 'rgba(3, 7, 18, 0.95)');
      grad.addColorStop(1, 'rgba(15, 23, 42, 0.4)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, horizon, width, groundH);

      const speed = (time * 0.0005) % 1;
      const totalH = 14;

      ctx.strokeStyle = 'rgba(56, 189, 248, 0.24)';
      ctx.lineWidth = 1.2;

      for (let i = 0; i <= totalH; i++) {
        const p = (i + speed) / totalH;
        if (p > 1) continue;
        const y = horizon + Math.pow(p, 2.6) * groundH;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      const totalV = 24;
      const vpX = width / 2;
      for (let i = -totalV; i <= totalV; i++) {
        const xBottom = vpX + i * (width / 14);
        ctx.beginPath();
        ctx.moveTo(vpX, horizon);
        ctx.lineTo(xBottom, height);
        ctx.stroke();
      }

      const glow = ctx.createLinearGradient(0, horizon - 15, 0, horizon + 15);
      glow.addColorStop(0, 'transparent');
      glow.addColorStop(0.5, 'rgba(56, 189, 248, 0.35)');
      glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.fillRect(0, horizon - 15, width, 30);
    }

    function loop() {
      time += 1 * animSpeedMultiplier;
      if (currentTheme === 'waves') renderWaves();
      else if (currentTheme === 'nebula') renderNebula();
      else if (currentTheme === 'aurora') renderAurora();
      else if (currentTheme === 'grid') renderGrid();
      requestAnimationFrame(loop);
    }
    loop();

    const themeBtn = document.getElementById('theme-btn');
    const themeDropdown = document.getElementById('theme-dropdown');
    const themeOptions = document.querySelectorAll('.theme-option');
    const speedSlider = document.getElementById('speed-slider');
    const speedBadge = document.getElementById('speed-badge');

    speedSlider.value = animSpeedMultiplier;
    speedBadge.textContent = `${animSpeedMultiplier.toFixed(1)}x`;

    speedSlider.addEventListener('input', (e) => {
      animSpeedMultiplier = parseFloat(e.target.value);
      speedBadge.textContent = `${animSpeedMultiplier.toFixed(1)}x`;
      localStorage.setItem('cloudy_anim_speed', animSpeedMultiplier);
    });

    function updateThemeUI() {
      themeOptions.forEach(opt => {
        opt.classList.toggle('active', opt.dataset.theme === currentTheme);
      });
    }
    updateThemeUI();

    themeBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      themeDropdown.classList.toggle('open');
    });

    themeDropdown.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    document.addEventListener('click', () => {
      themeDropdown.classList.remove('open');
    });

    themeOptions.forEach(opt => {
      opt.addEventListener('click', () => {
        currentTheme = opt.dataset.theme;
        localStorage.setItem('cloudy_theme', currentTheme);
        updateThemeUI();
      });
    });

    const logo = document.getElementById('main-logo');
    const logoFallback = document.getElementById('brand-fallback-text');
    logo.onerror = () => {
      logo.style.display = 'none';
      logoFallback.style.display = 'block';
    };

    const shelfArea = document.getElementById('shelf-scroll-area');
    const scrollbarThumb = document.getElementById('scrollbar-thumb');
    const detailsTitle = document.getElementById('details-title');
    const detailsDescription = document.getElementById('details-description');
    const shelfContainer = document.getElementById('shelf-container');

    const gameOverlay = document.getElementById('game-overlay');
    const gameFrame = document.getElementById('game-frame');
    const btnExit = document.getElementById('btn-exit-game');
    const btnFullscreen = document.getElementById('btn-toggle-fullscreen');

    shelfArea.addEventListener('wheel', (e) => {
      e.preventDefault();
      shelfArea.scrollLeft += e.deltaY;
    }, { passive: false });

    function syncScrollbar() {
      const scrollWidth = shelfArea.scrollWidth - shelfArea.clientWidth;
      if (scrollWidth <= 0) {
        scrollbarThumb.style.width = '100%';
        scrollbarThumb.style.left = '0%';
        return;
      }
      const thumbRatio = shelfArea.clientWidth / shelfArea.scrollWidth;
      const thumbWidthPercent = Math.max(thumbRatio * 100, 8);
      const scrollPercent = shelfArea.scrollLeft / scrollWidth;
      const maxLeftPercent = 100 - thumbWidthPercent;

      scrollbarThumb.style.width = `${thumbWidthPercent}%`;
      scrollbarThumb.style.left = `${scrollPercent * maxLeftPercent}%`;
    }
    shelfArea.addEventListener('scroll', syncScrollbar);

    function setFocusedGame(game) {
      if (!game) {
        detailsTitle.classList.remove('active');
        detailsDescription.classList.remove('active');
        return;
      }
      detailsTitle.textContent = game.title;
      detailsDescription.textContent = game.description || game.desc || '';
      detailsTitle.classList.add('active');
      detailsDescription.classList.add('active');
    }

    function clearFocusedGame() {
      detailsTitle.classList.remove('active');
      detailsDescription.classList.remove('active');
    }

    async function launchGame(game) {
      if (!game || !game.path) return;

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {}

      const cleanPath = game.path.startsWith('http') || game.path.startsWith('./') ? game.path : `./${game.path}`;
      gameFrame.src = cleanPath;
      gameOverlay.classList.add('running');
    }

    function closeGame() {
      gameOverlay.classList.remove('running');
      setTimeout(() => {
        gameFrame.src = 'about:blank';
      }, 800);
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    btnExit.addEventListener('click', closeGame);

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    async function loadGames() {
      shelfArea.innerHTML = '';
      clearFocusedGame();

      try {
        const response = await fetch(`games.json?t=${Date.now()}`);
        if (!response.ok) throw new Error();
        const games = await response.json();

        if (!Array.isArray(games) || games.length === 0) {
          renderEmptyState();
          return;
        }

        renderGames(games);
      } catch (err) {
        renderEmptyState();
      }
    }

    function renderGames(games) {
      shelfContainer.style.display = 'flex';

      games.forEach(game => {
        const tile = document.createElement('div');
        tile.className = 'game-tile';
        tile.tabIndex = 0;

        const tileInner = document.createElement('div');
        tileInner.className = 'game-tile-inner';

        const cover = document.createElement('img');
        cover.className = 'game-cover-art';
        cover.alt = game.title || 'Game Cover';
        cover.src = game.cover ? (game.cover.startsWith('http') || game.cover.startsWith('./') ? game.cover : `./${game.cover}`) : '';
        cover.onerror = () => {
          cover.style.display = 'none';
        };

        const border = document.createElement('div');
        border.className = 'game-tile-border';

        tileInner.appendChild(cover);
        tile.appendChild(tileInner);
        tile.appendChild(border);

        tile.addEventListener('mouseenter', () => setFocusedGame(game));
        tile.addEventListener('mouseleave', clearFocusedGame);
        tile.addEventListener('focus', () => setFocusedGame(game));
        tile.addEventListener('blur', clearFocusedGame);
        tile.addEventListener('click', () => launchGame(game));

        shelfArea.appendChild(tile);
      });

      syncScrollbar();
    }

    function renderEmptyState() {
      shelfArea.innerHTML = '';
      const emptyBox = document.createElement('div');
      emptyBox.className = 'empty-shelf';

      const title = document.createElement('div');
      title.className = 'empty-shelf-title';
      title.textContent = 'No Available Games';

      const subtitle = document.createElement('div');
      subtitle.className = 'empty-shelf-subtitle';
      subtitle.textContent = 'Check your connection or verify service status. Games will appear automatically once deployed.';

      const btn = document.createElement('button');
      btn.className = 'retry-button';
      btn.textContent = 'Retry';
      btn.onclick = loadGames;

      emptyBox.appendChild(title);
      emptyBox.appendChild(subtitle);
      emptyBox.appendChild(btn);

      shelfArea.appendChild(emptyBox);
      syncScrollbar();
    }

    loadGames();
  </script>
</body>
</html>
