<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudy</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background-color: #030712;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    .ambient-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 48px 56px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-logo {
      height: 38px;
      max-width: 180px;
      object-fit: contain;
    }

    .brand-fallback {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
    }

    .shelf-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
      width: 100%;
      margin-top: auto;
      margin-bottom: 24px;
    }

    .shelf-scroll-area {
      display: flex;
      gap: 28px;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 18px 4px;
      scroll-behavior: smooth;
      scrollbar-width: none;
    }

    .shelf-scroll-area::-webkit-scrollbar {
      display: none;
    }

    .game-tile {
      position: relative;
      flex: 0 0 340px;
      aspect-ratio: 16 / 9;
      border-radius: 20px;
      background: #090e1a;
      cursor: pointer;
      outline: none;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-tile-inner {
      width: 100%;
      height: 100%;
      border-radius: inherit;
      overflow: hidden;
      position: relative;
      background: radial-gradient(circle at center, #1e293b, #090d16);
      transform-origin: center;
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-cover-art {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .game-tile-border {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      pointer-events: none;
      opacity: 0;
      border: 5px solid #2563eb;
      box-shadow: inset 0 0 16px rgba(56, 189, 248, 0.5), 0 0 24px rgba(37, 99, 235, 0.6);
      transition: opacity 0.3s ease;
    }

    .game-tile:hover .game-tile-inner,
    .game-tile:focus-visible .game-tile-inner {
      transform: scale(0.97);
    }

    .game-tile:hover .game-tile-border,
    .game-tile:focus-visible .game-tile-border {
      opacity: 1;
      animation: switchBorderShift 2.4s ease-in-out infinite alternate;
    }

    .game-tile:active .game-tile-inner {
      transform: scale(0.94);
    }

    @keyframes switchBorderShift {
      0% {
        border-color: #2563eb;
        box-shadow: inset 0 0 16px rgba(37, 99, 235, 0.6), 0 0 20px rgba(37, 99, 235, 0.5);
      }
      50% {
        border-color: #0284c7;
        box-shadow: inset 0 0 22px rgba(2, 132, 199, 0.8), 0 0 32px rgba(2, 132, 199, 0.7);
      }
      100% {
        border-color: #38bdf8;
        box-shadow: inset 0 0 18px rgba(56, 189, 248, 0.9), 0 0 28px rgba(56, 189, 248, 0.8);
      }
    }

    .custom-scrollbar-track {
      width: calc(100% - 48px);
      margin: 0 auto;
      height: 6px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
    }

    .custom-scrollbar-thumb {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 20%;
      background: linear-gradient(90deg, #2563eb, #38bdf8);
      border-radius: 999px;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      transition: left 0.1s ease-out, width 0.1s ease-out;
    }

    .details-pane {
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      pointer-events: none;
    }

    .details-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #ffffff;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .details-description {
      margin-top: 6px;
      font-size: 16px;
      line-height: 1.5;
      color: rgba(255, 255, 255, 0.7);
      max-width: 640px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      transition-delay: 0.04s;
    }

    .details-title.active,
    .details-description.active {
      opacity: 1;
      transform: translateY(0);
    }

    .empty-shelf {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
      padding: 64px 0;
    }

    .empty-shelf-title {
      font-size: 26px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
    }

    .empty-shelf-subtitle {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.5);
      max-width: 440px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .retry-button {
      padding: 12px 32px;
      border-radius: 999px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      background: rgba(14, 165, 233, 0.12);
      color: #38bdf8;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      backdrop-filter: blur(8px);
      transition: all 0.25s ease;
    }

    .retry-button:hover {
      background: rgba(14, 165, 233, 0.28);
      border-color: #38bdf8;
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.4);
      transform: scale(1.04);
    }

    .game-runtime-overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: #000000;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.96);
      transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .game-runtime-overlay.running {
      opacity: 1;
      pointer-events: all;
      transform: scale(1);
    }

    .game-frame {
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
    }

    .hud-hover-zone {
      position: absolute;
      top: 0;
      right: 0;
      width: 240px;
      height: 140px;
      z-index: 120;
      display: flex;
      justify-content: flex-end;
      align-items: flex-start;
      padding: 24px;
    }

    .hud-controls-dock {
      display: flex;
      gap: 12px;
      opacity: 0;
      transform: translateY(-8px);
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }

    .hud-hover-zone:hover .hud-controls-dock {
      opacity: 1;
      transform: translateY(0);
      pointer-events: all;
    }

    .hud-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(16px);
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
      transition: all 0.2s ease;
    }

    .hud-btn:hover {
      background: rgba(37, 99, 235, 0.8);
      border-color: #38bdf8;
      box-shadow: 0 0 16px rgba(56, 189, 248, 0.6);
      transform: scale(1.08);
    }

    .hud-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }
  </style>
</head>
<body>

  <canvas id="ambient-waves" class="ambient-canvas"></canvas>

  <div class="app-viewport">
    <header class="brand-header">
      <img src="logo.png" alt="Cloudy" class="brand-logo" id="main-logo">
      <div class="brand-fallback" id="brand-fallback-text" style="display: none;">Cloudy</div>
    </header>

    <div class="shelf-container" id="shelf-container">
      <div class="shelf-scroll-area" id="shelf-scroll-area"></div>
      <div class="custom-scrollbar-track" id="scrollbar-track">
        <div class="custom-scrollbar-thumb" id="scrollbar-thumb"></div>
      </div>
    </div>

    <div class="details-pane">
      <div class="details-title" id="details-title"></div>
      <div class="details-description" id="details-description"></div>
    </div>
  </div>

  <div class="game-runtime-overlay" id="game-overlay">
    <div class="hud-hover-zone">
      <div class="hud-controls-dock">
        <button class="hud-btn" id="btn-toggle-fullscreen">
          <svg viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
        </button>
        <button class="hud-btn" id="btn-exit-game">
          <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
      </div>
    </div>
    <iframe class="game-frame" id="game-frame" allow="autoplay; fullscreen; gamepad"></iframe>
  </div>

  <script>
    const canvas = document.getElementById('ambient-waves');
    const ctx = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let waveTime = 0;

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width;
      canvas.height = height;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const waves = [
      { speed: 0.0007, amplitude: 90, frequency: 0.0016, color: 'rgba(37, 99, 235, 0.28)', yOffset: 0.65 },
      { speed: 0.0011, amplitude: 130, frequency: 0.0011, color: 'rgba(2, 132, 199, 0.24)', yOffset: 0.72 },
      { speed: 0.0005, amplitude: 160, frequency: 0.0008, color: 'rgba(56, 189, 248, 0.16)', yOffset: 0.78 }
    ];

    function renderWaves() {
      waveTime += 1;
      ctx.clearRect(0, 0, width, height);

      waves.forEach(wave => {
        ctx.beginPath();
        ctx.moveTo(0, height);

        for (let x = 0; x <= width; x += 12) {
          const y = height * wave.yOffset +
            Math.sin(x * wave.frequency + waveTime * wave.speed) * wave.amplitude +
            Math.sin(x * wave.frequency * 0.5 + waveTime * wave.speed * 0.8) * (wave.amplitude * 0.4);
          ctx.lineTo(x, y);
        }

        ctx.lineTo(width, height);
        ctx.closePath();
        ctx.fillStyle = wave.color;
        ctx.fill();
      });

      requestAnimationFrame(renderWaves);
    }
    requestAnimationFrame(renderWaves);

    const logo = document.getElementById('main-logo');
    const logoFallback = document.getElementById('brand-fallback-text');
    logo.onerror = () => {
      logo.style.display = 'none';
      logoFallback.style.display = 'block';
    };

    const shelfArea = document.getElementById('shelf-scroll-area');
    const scrollbarThumb = document.getElementById('scrollbar-thumb');
    const detailsTitle = document.getElementById('details-title');
    const detailsDescription = document.getElementById('details-description');
    const shelfContainer = document.getElementById('shelf-container');

    const gameOverlay = document.getElementById('game-overlay');
    const gameFrame = document.getElementById('game-frame');
    const btnExit = document.getElementById('btn-exit-game');
    const btnFullscreen = document.getElementById('btn-toggle-fullscreen');

    shelfArea.addEventListener('wheel', (e) => {
      e.preventDefault();
      shelfArea.scrollLeft += e.deltaY;
    }, { passive: false });

    function syncScrollbar() {
      const scrollWidth = shelfArea.scrollWidth - shelfArea.clientWidth;
      if (scrollWidth <= 0) {
        scrollbarThumb.style.width = '100%';
        scrollbarThumb.style.left = '0%';
        return;
      }
      const thumbRatio = shelfArea.clientWidth / shelfArea.scrollWidth;
      const thumbWidthPercent = Math.max(thumbRatio * 100, 8);
      const scrollPercent = shelfArea.scrollLeft / scrollWidth;
      const maxLeftPercent = 100 - thumbWidthPercent;

      scrollbarThumb.style.width = `${thumbWidthPercent}%`;
      scrollbarThumb.style.left = `${scrollPercent * maxLeftPercent}%`;
    }
    shelfArea.addEventListener('scroll', syncScrollbar);

    function setFocusedGame(game) {
      if (!game) {
        detailsTitle.classList.remove('active');
        detailsDescription.classList.remove('active');
        return;
      }
      detailsTitle.textContent = game.title;
      detailsDescription.textContent = game.description;
      detailsTitle.classList.add('active');
      detailsDescription.classList.add('active');
    }

    function clearFocusedGame() {
      detailsTitle.classList.remove('active');
      detailsDescription.classList.remove('active');
    }

    async function launchGame(game) {
      if (!game || !game.path) return;

      try {
        if (!document.fullscreenElement) {
          await document.documentElement.requestFullscreen();
        }
      } catch (err) {}

      gameFrame.src = game.path;
      gameOverlay.classList.add('running');
    }

    function closeGame() {
      gameOverlay.classList.remove('running');
      setTimeout(() => {
        gameFrame.src = 'about:blank';
      }, 800);
      if (document.fullscreenElement) {
        document.exitFullscreen().catch(() => {});
      }
    }

    btnExit.addEventListener('click', closeGame);

    btnFullscreen.addEventListener('click', () => {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    });

    async function loadGames() {
      shelfArea.innerHTML = '';
      clearFocusedGame();

      try {
        const response = await fetch(`games.json?t=${Date.now()}`);
        if (!response.ok) throw new Error();
        const games = await response.json();

        if (!Array.isArray(games) || games.length === 0) {
          renderEmptyState();
          return;
        }

        renderGames(games);
      } catch (err) {
        renderEmptyState();
      }
    }

    function renderGames(games) {
      shelfContainer.style.display = 'flex';

      games.forEach(game => {
        const tile = document.createElement('div');
        tile.className = 'game-tile';
        tile.tabIndex = 0;

        const tileInner = document.createElement('div');
        tileInner.className = 'game-tile-inner';

        const cover = document.createElement('img');
        cover.className = 'game-cover-art';
        cover.alt = game.title || 'Game Cover';
        cover.src = game.cover ? (game.cover.startsWith('http') ? game.cover : `./${game.cover}`) : '';
        cover.onerror = () => {
          cover.style.display = 'none';
        };

        const border = document.createElement('div');
        border.className = 'game-tile-border';

        tileInner.appendChild(cover);
        tile.appendChild(tileInner);
        tile.appendChild(border);

        tile.addEventListener('mouseenter', () => setFocusedGame(game));
        tile.addEventListener('mouseleave', clearFocusedGame);
        tile.addEventListener('focus', () => setFocusedGame(game));
        tile.addEventListener('blur', clearFocusedGame);
        tile.addEventListener('click', () => launchGame(game));

        shelfArea.appendChild(tile);
      });

      syncScrollbar();
    }

    function renderEmptyState() {
      shelfArea.innerHTML = '';
      const emptyBox = document.createElement('div');
      emptyBox.className = 'empty-shelf';

      const title = document.createElement('div');
      title.className = 'empty-shelf-title';
      title.textContent = 'No Available Games';

      const subtitle = document.createElement('div');
      subtitle.className = 'empty-shelf-subtitle';
      subtitle.textContent = 'Check your connection or verify service status. Games will appear automatically once deployed.';

      const btn = document.createElement('button');
      btn.className = 'retry-button';
      btn.textContent = 'Retry';
      btn.onclick = loadGames;

      emptyBox.appendChild(title);
      emptyBox.appendChild(subtitle);
      emptyBox.appendChild(btn);

      shelfArea.appendChild(emptyBox);
      syncScrollbar();
    }

    loadGames();
  </script>
</body>
</html>
