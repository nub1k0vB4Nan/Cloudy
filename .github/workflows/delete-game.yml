name: Delete Game from Cloudy

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Game Folder ID to delete (e.g. efm-demo1)'
        required: true
        type: string

jobs:
  delete-game:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Remove game directory
        run: |
          rm -rf "games/${{ inputs.game_id }}"

      - name: Clean games.json
        run: |
          python3 - << 'EOF'
          import json, os
          path = 'games.json'
          if os.path.exists(path):
              try:
                  with open(path, 'r', encoding='utf-8') as f:
                      games = json.load(f)
                  games = [g for g in games if g.get("id") != "${{ inputs.game_id }}"]
                  with open(path, 'w', encoding='utf-8') as f:
                      json.dump(games, f, indent=2, ensure_ascii=False)
              except Exception:
                  pass
          EOF

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Delete game: ${{ inputs.game_id }}" || echo "No changes"
          git push -v origin main
